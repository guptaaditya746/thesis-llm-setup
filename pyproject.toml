[project]
name = "llm-setup"
version = "0.2.0"
description = "Minimal profile-driven local LLM serving supervisor"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pyyaml>=6", "uvicorn>=0.30"]

[project.optional-dependencies]
serve = ["vllm==0.21.0", "litellm[proxy]>=1.92"]
dev = ["pytest>=8", "ruff>=0.9"]
# The optional GLiNER service (src/llm_setup/gliner_server.py). Its torch is the one vLLM pins
# (serve): the two are always installed together, so there is no separate PyTorch index here
# (docs/OPERATIONS.md, "GLiNER").
gliner = ["gliner==0.2.29"]

[project.scripts]
llm-setup = "llm_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_setup"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
