# Three different models, one GPU each: heavy-model (quality review), lite-model (extraction and the
# agent tool loop) and qwen-embed (embeddings only). Needs a 3-GPU allocation.
name: heavy-lite-embed
models:
  heavy:
    alias: heavy-model
    model: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
    gpus: [0]
    port: 8002
    max_num_active_seqs: 4
    max_num_queued_reqs: 8
    max_model_len: 32768
    gpu_memory_utilization: 0.92
    kv_cache_dtype: auto              # fp8 needs nvcc on A100; see docs/PROFILES.md
    tool_call_parser: hermes          # Qwen3 uses Hermes-style tool calls
  lite:
    alias: lite-model
    model: ibm-granite/granite-4.1-8b
    gpus: [1]
    port: 8003
    max_num_active_seqs: 8
    max_num_queued_reqs: 16
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    tool_call_parser: granite4
  embed:
    alias: qwen-embed
    model: ${EMBED_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
    task: embed
    gpus: [2]
    port: 8001
    max_num_active_seqs: 32
    max_num_queued_reqs: 64
    max_model_len: 8192
    gpu_memory_utilization: 0.85
