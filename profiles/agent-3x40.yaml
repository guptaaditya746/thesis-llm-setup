name: agent-3x40
bind_host: 127.0.0.1
gateway:
  host: 127.0.0.1
  port: 4000
status:
  host: 127.0.0.1
  port: 8010
models:
  orch:
    alias: orch-model
    model: Qwen/Qwen3.8-27B-FP8
    revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    gpu: 0
    port: 8001
    max_num_active_seqs: 8
    max_num_queued_reqs: 8
    max_model_len: 65536
    gpu_memory_utilization: 0.92
    kv_cache_dtype: auto
    extra_args:
      - --reasoning-parser
      - qwen3
      - --generation-config
      - vllm
      - --enable-prefix-caching
  sub:
    alias: sub-model
    model: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
    revision: 5a5a776300a41aaa681dd7ff0106608ef2bc90db
    gpu: 1
    port: 8002
    replicas:
      - gpu: 2
        port: 8004
    max_num_active_seqs: 3
    max_num_queued_reqs: 8
    max_model_len: 32768
    gpu_memory_utilization: 0.92
    kv_cache_dtype: auto
    tool_call_parser: hermes
# GLiNER (named entities for the thesis evidence engine) as a small HTTP service on 127.0.0.1:8090,
# sharing a GPU with a model. Off: uncomment to start it after the models are ready (the batch job
# then installs the gliner extra). Its weights and its backbone's tokenizer (microsoft/deberta-v3-base)
# must be in the Hugging Face cache first: it loads offline. See docs/OPERATIONS.md, "GLiNER".
# GLiNER needs an estimated 1.5-2 GB on its GPU (not yet measured); at gpu_memory_utilization 0.92 a 40 GB A100 has about 3 GB
# left, and a model restarted while GLiNER runs finds less free memory. Lower that model's
# gpu_memory_utilization (for example to 0.88) if it fails to restart.
# gliner:
#   enabled: true
#   gpu: 0
#   port: 8090
#   model: urchade/gliner_medium-v2.1
#   revision: 40ec419335d09393f298636f471328b722c6da9e
#   max_chars: 1500
storage:
  database: runtime/status.sqlite3
